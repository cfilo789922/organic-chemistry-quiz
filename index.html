<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>官能基マスター</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <h1>官能基マスター</h1>
        <p>有機化学の核となる官能基をマスターしよう</p>


        <div id="menu">
            <h2>モードを選択</h2>

            <button onclick="startQuiz(1)">
                構造式　→　官能基名
            </button>

            <button onclick="startQuiz(2)">
                構造式　→　一般名
            </button>

            <button onclick="startQuiz(3)">
                官能基名　→　構造式
            </button>

            <button onclick="showRecords()">
                学習記録
            </button>
        </div>

        <div id="quiz-screen" style="display: none;">
            <h2 id="quiz-title">問題</h2>
            <p id="question-number"></p>

            <div id="question"></div>
            <div id="choices"></div>
            <div id="feedback"></div>
            <button id="next-button" onclick="nextQuestion()" style="display: none;">
                次へ
            </button>

        </div>

        <div id="record-screen" style="display: none;">
            <h2>学習記録</h2>
            <div id="record-list"></div>
        </div>

        <div id="result-screen" style="display: none;">
            <h2>結果</h2>
            <p id="result-score"></p>
            <button onclick="returnMenu()">メニューへ戻る</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
