<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>官能基マスター</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">

        <div id="menu">
            <h1>有機化学マスター</h1>
            <p class="menu-subtitle">有機化学の核となる官能基を習得しよう</p>

            <div class="menu-section">
                <h3>LEARNING MENU</h3>
                <p class="section-descriction">学習モードを選択</p>

                <button class="menu-card quiz-card" onclick="startQuiz(1)">
                    <span class="card-number">01</span>
                    <span class="card-text">
                        <strong>官能基名を答える</strong>
                        <small>構造式　→　官能基名</small>
                    </span>
                    <span class="card-arrow">》</span>
                </button>

                <button class="menu-card quiz-card" onclick="startQuiz(2)">
                    <span class="card-number">02</span>
                    <span class="card-text">
                        <strong>一般名を答える</strong>
                        <small>構造式　→　一般名</small>
                    </span>
                    <span class="card-arrow">》</span>
                </button>

                <button class="menu-card quiz-card" onclick="startQuiz(3)">
                    <span class="card-number">03</span>
                    <span class="card-text">
                        <strong>構造式を答える</strong>
                        <small>官能基名　→　構造式</small>
                    </span>
                    <span class="card-arrow">》</span>
                </button>
            </div>

            <div class="record-section">
                <h3>YOUR PROGRESS</h3>

                <button class="menu-card record-card" onclick="showRecords()">
                    <span class="card-text">
                        <strong>学習記録</strong>
                        <small>官能基ごとの正答率を確認</small>
                    </span>
                </button>
            </div>

        </div>



        <div id="quiz-screen" style="display: none;">
            <h3 id="quiz-title">問題</h3>

            <p id="question-number"></p>

            <div id="progress-bar">
                <div id="progress"></div>
            </div>

            <div id="question"></div>
            <div id="choices"></div>
            <div id="feedback"></div>

            <div id="next-button-area">
                <button id="next-button" onclick="nextQuestion()" style="display: none;">
                    次へ
                </button>
            </div>
        </div>



        <div id="record-screen" style="display: none;">
            <h2>学習記録</h2>
            <div id="record-list"></div>
            <button onclick="returnMenu()">メニューへ戻る</button>
        </div>

        <div id="result-screen" style="display: none;">
            <h2>結果</h2>
            <h2 id="result-score"></h2>
            <button onclick="returnMenu()">メニューへ戻る</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
